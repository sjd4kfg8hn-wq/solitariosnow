<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SolitarioSnow - Cyber Alpine Techno Edition</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between overflow-x-hidden select-none font-rajdhani">

    <!-- Header HUD -->
    <header class="w-full p-4 flex flex-wrap justify-between items-center z-20 gap-4 bg-black/40 backdrop-blur-md border-b border-cyan-500/20">
        <div class="flex items-center space-x-3">
            <h1 class="text-2xl sm:text-3xl font-black font-orbitron tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-fuchsia-500 to-purple-400 drop-shadow-[0_0_10px_rgba(0,231,255,0.8)]">
                SOLITARIO<span class="text-white">SNOW</span>
            </h1>
            <span class="bg-cyan-500/20 text-cyan-300 text-xs px-2 py-0.5 rounded border border-cyan-400/40 font-orbitron">v1.0 TECHNO</span>
        </div>

        <!-- Marcadores corregidos -->
        <div class="flex items-center space-x-3 sm:space-x-6 font-orbitron bg-black/50 px-4 py-2 rounded-xl border border-cyan-500/30">
            <div class="text-center">
                <div class="text-[10px] text-gray-400 tracking-widest uppercase">Score</div>
                <div id="score" class="text-cyan-400 text-lg sm:text-xl font-bold">0</div>
            </div>
            <div class="h-6 w-[1px] bg-cyan-500/30"></div>
            <div class="text-center">
                <div class="text-[10px] text-gray-400 tracking-widest uppercase">Movimientos</div>
                <div id="moves" class="text-fuchsia-400 text-lg sm:text-xl font-bold">0</div>
            </div>
            <div class="h-6 w-[1px] bg-cyan-500/30"></div>
            <div class="text-center">
                <div class="text-[10px] text-gray-400 tracking-widest uppercase">Tiempo</div>
                <div id="timer" class="text-white text-lg sm:text-xl font-bold">00:00</div>
            </div>
        </div>

        <!-- Controles globales -->
        <div class="flex items-center space-x-2">
            <button id="btn-audio" class="px-3 py-2 bg-slate-900 border border-cyan-500/40 text-cyan-300 rounded-lg hover:bg-cyan-500/20 transition-all font-orbitron text-xs flex items-center gap-1">
                🔊 Audio: <span id="audio-status">OFF</span>
            </button>
            <button id="btn-new-game" class="px-4 py-2 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-black font-bold font-orbitron rounded-lg shadow-[0_0_15px_rgba(0,231,255,0.4)] transition-all text-sm">
                NUEVA PARTIDA
            </button>
        </div>
    </header>

    <!-- Tablero de juego -->
    <main class="flex-grow flex flex-col justify-center items-center p-2 sm:p-6 z-10 w-full max-w-7xl mx-auto">
        <!-- Zonas superiores (Stock, Waste, Foundations) -->
        <div class="w-full flex justify-between items-center mb-6 sm:mb-10 max-w-4xl px-2">
            <!-- Mazos (Stock & Waste) -->
            <div class="flex space-x-2 sm:space-x-4">
                <div id="stock" class="slot card-slot flex items-center justify-center cursor-pointer relative rounded-xl">
                    <span class="text-cyan-500/40 text-2xl">🔄</span>
                </div>
                <div id="waste" class="slot card-slot relative rounded-xl"></div>
            </div>

            <!-- Fundaciones (♥ ♦ ♣ ♠) -->
            <div class="flex space-x-2 sm:space-x-4">
                <div id="foundation-0" data-foundation-idx="0" class="slot card-slot foundation-slot flex items-center justify-center rounded-xl" data-suit="♠">
                    <span class="text-cyan-500/30 text-2xl">♠</span>
                </div>
                <div id="foundation-1" data-foundation-idx="1" class="slot card-slot foundation-slot flex items-center justify-center rounded-xl" data-suit="♥">
                    <span class="text-fuchsia-500/30 text-2xl">♥</span>
                </div>
                <div id="foundation-2" data-foundation-idx="2" class="slot card-slot foundation-slot flex items-center justify-center rounded-xl" data-suit="♣">
                    <span class="text-cyan-500/30 text-2xl">♣</span>
                </div>
                <div id="foundation-3" data-foundation-idx="3" class="slot card-slot foundation-slot flex items-center justify-center rounded-xl" data-suit="♦">
                    <span class="text-fuchsia-500/30 text-2xl">♦</span>
                </div>
            </div>
        </div>

        <!-- Tableau (7 columnas) -->
        <div class="w-full flex justify-between items-start max-w-4xl px-2 min-h-[400px]">
            <div id="tableau-0" data-tableau-idx="0" class="slot tableau-column flex-1"></div>
            <div id="tableau-1" data-tableau-idx="1" class="slot tableau-column flex-1"></div>
            <div id="tableau-2" data-tableau-idx="2" class="slot tableau-column flex-1"></div>
            <div id="tableau-3" data-tableau-idx="3" class="slot tableau-column flex-1"></div>
            <div id="tableau-4" data-tableau-idx="4" class="slot tableau-column flex-1"></div>
            <div id="tableau-5" data-tableau-idx="5" class="slot tableau-column flex-1"></div>
            <div id="tableau-6" data-tableau-idx="6" class="slot tableau-column flex-1"></div>
        </div>
    </main>

    <!-- Footer / Barra Inferior estilo Techno Lounge -->
    <footer class="w-full bg-black/60 backdrop-blur-md border-t border-fuchsia-500/30 p-3 z-20 flex justify-between items-center px-6">
        <div class="flex space-x-4 text-xs font-orbitron">
            <button class="text-gray-400 hover:text-cyan-400 transition-colors">DAILY CHALLENGE</button>
            <span class="text-gray-700">|</span>
            <button class="text-gray-400 hover:text-fuchsia-400 transition-colors">RANKING</button>
            <span class="text-gray-700">|</span>
            <button class="text-gray-400 hover:text-cyan-400 transition-colors">SHOP</button>
        </div>
        <div class="text-[10px] text-gray-500 font-orbitron">
            RECORD: <span id="high-score" class="text-fuchsia-400">0</span> PTS
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/audio.js"></script>
    <script src="js/solitaire.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
