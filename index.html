<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SolitarioSnow - Cyber Alpine Techno Edition</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-glow: #00e7ff;
            --pink-glow: #ff4dff;
        }

        body {
            background-image: linear-gradient(to bottom, rgba(5, 7, 15, 0.75), rgba(10, 15, 30, 0.9)), url('imagenes/solitario_table.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
        }

        .card-slot, .tableau-column {
            min-height: 120px;
            border: 1px dashed rgba(0, 231, 255, 0.2);
            border-radius: 12px;
            transition: all 0.2s ease;
        }

        .tableau-column {
            border: none;
            position: relative;
            margin: 0 4px;
        }

        .card {
            width: 80px;
            height: 115px;
            border-radius: 12px;
            background: #0d1322;
            border: 2px solid var(--cyan-glow);
            box-shadow: 0 0 10px rgba(0, 231, 255, 0.3);
            color: white;
            font-family: 'Orbitron', sans-serif;
            position: absolute;
            cursor: pointer;
            user-select: none;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
        }

        @media (min-width: 640px) {
            .card {
                width: 95px;
                height: 135px;
            }
            .card-slot {
                width: 95px;
                height: 135px;
            }
        }

        .card.red {
            border-color: var(--pink-glow);
            box-shadow: 0 0 10px rgba(255, 77, 255, 0.3);
            color: var(--pink-glow);
        }

        .card.black {
            border-color: var(--cyan-glow);
            color: var(--cyan-glow);
        }

        .card.face-down {
            background: linear-gradient(135deg, #09111e 0%, #170a2c 100%);
            border: 2px solid #3b82f6;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.4);
        }

        .card.face-down::after {
            content: "❄";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.8rem;
            color: rgba(0, 231, 255, 0.4);
        }

        .card.selected-root {
            z-index: 999 !important;
            transform: translateY(-8px);
            box-shadow: 0 0 25px var(--cyan-glow);
        }

        .card.red.selected-root {
            box-shadow: 0 0 25px var(--pink-glow);
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between overflow-x-hidden select-none font-rajdhani">

    <!-- Header HUD -->
    <header class="w-full p-4 flex flex-wrap justify-between items-center z-20 gap-4 bg-black/40 backdrop-blur-md border-b border-cyan-500/20">
        <div class="flex items-center space-x-3">
            <h1 class="text-2xl sm:text-3xl font-black font-orbitron tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-fuchsia-500 to-purple-400 drop-shadow-[0_0_10px_rgba(0,231,255,0.8)]">
                SOLITARIO<span class="text-white">SNOW</span>
            </h1>
            <span class="bg-cyan-500/20 text-cyan-300 text-xs px-2 py-0.5 rounded border border-cyan-400/40 font-orbitron">v1.0 TECHNO</span>
        </div>

        <div class="flex items-center space-x-3 sm:space-x-6 font-orbitron bg-black/50 px-4 py-2 rounded-xl border border-cyan-500/30">
            <div class="text-center">
                <div class="text-[10px] text-gray-400 tracking-widest uppercase">Score</div>
                <div id="score" class="text-cyan-400 text-lg sm:text-xl font-bold">0</div>
            </div>
            <div class="h-6 w-[1px] bg-cyan-500/30"></div>
            <div class="text-center">
                <div class="text-[10px] text-gray-400 tracking-widest uppercase">Movimientos</div>
                <div id="moves" class="text-fuchsia-400 text-lg sm:text-xl font-bold">0</div>
            </div>
            <div class="h-6 w-[1px] bg-cyan-500/30"></div>
            <div class="text-center">
                <div class="text-[10px] text-gray-400 tracking-widest uppercase">Tiempo</div>
                <div id="timer" class="text-white text-lg sm:text-xl font-bold">00:00</div>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <button id="btn-audio" class="px-3 py-2 bg-slate-900 border border-cyan-500/40 text-cyan-300 rounded-lg hover:bg-cyan-500/25 transition-all font-orbitron text-xs flex items-center gap-1 cursor-pointer">
                🔊 Audio: <span id="audio-status">OFF</span>
            </button>
            <button id="btn-new-game" class="px-4 py-2 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-black font-bold font-orbitron rounded-lg shadow-[0_0_15px_rgba(0,231,255,0.4)] transition-all text-sm cursor-pointer">
                NUEVA PARTIDA
            </button>
        </div>
    </header>

    <!-- Tablero de juego -->
    <main class="flex-grow flex flex-col justify-center items-center p-2 sm:p-6 z-10 w-full max-w-7xl mx-auto">
        <div class="w-full flex justify-between items-center mb-6 sm:mb-10 max-w-4xl px-2">
            <div class="flex space-x-2 sm:space-x-4">
                <div id="stock" class="slot card-slot flex items-center justify-center cursor-pointer relative rounded-xl">
                    <span class="text-cyan-500/40 text-2xl">🔄</span>
                </div>
                <div id="waste" class="slot card-slot relative rounded-xl"></div>
            </div>

            <div class="flex space-x-2 sm:space-x-4">
                <div id="foundation-0" data-foundation-idx="0" class="slot card-slot foundation-slot flex items-center justify-center rounded-xl">
                    <span class="text-cyan-500/30 text-2xl">♠</span>
                </div>
                <div id="foundation-1" data-foundation-idx="1" class="slot card-slot foundation-slot flex items-center justify-center rounded-xl">
                    <span class="text-fuchsia-500/30 text-2xl">♥</span>
                </div>
                <div id="foundation-2" data-foundation-idx="2" class="slot card-slot foundation-slot flex items-center justify-center rounded-xl">
                    <span class="text-cyan-500/30 text-2xl">♣</span>
                </div>
                <div id="foundation-3" data-foundation-idx="3" class="slot card-slot foundation-slot flex items-center justify-center rounded-xl">
                    <span class="text-fuchsia-500/30 text-2xl">♦</span>
                </div>
            </div>
        </div>

        <div class="w-full flex justify-between items-start max-w-4xl px-2 min-h-[400px]">
            <div id="tableau-0" data-tableau-idx="0" class="slot tableau-column flex-1"></div>
            <div id="tableau-1" data-tableau-idx="1" class="slot tableau-column flex-1"></div>
            <div id="tableau-2" data-tableau-idx="2" class="slot tableau-column flex-1"></div>
            <div id="tableau-3" data-tableau-idx="3" class="slot tableau-column flex-1"></div>
            <div id="tableau-4" data-tableau-idx="4" class="slot tableau-column flex-1"></div>
            <div id="tableau-5" data-tableau-idx="5" class="slot tableau-column flex-1"></div>
            <div id="tableau-6" data-tableau-idx="6" class="slot tableau-column flex-1"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full bg-black/60 backdrop-blur-md border-t border-fuchsia-500/30 p-3 z-20 flex justify-between items-center px-6">
        <div class="flex space-x-4 text-xs font-orbitron">
            <button class="text-gray-400 hover:text-cyan-400 transition-colors">DAILY CHALLENGE</button>
            <span class="text-gray-700">|</span>
            <button class="text-gray-400 hover:text-fuchsia-400 transition-colors">RANKING</button>
            <span class="text-gray-700">|</span>
            <button class="text-gray-400 hover:text-cyan-400 transition-colors">SHOP</button>
        </div>
        <div class="text-[10px] text-gray-500 font-orbitron">
            RECORD: <span id="high-score" class="text-fuchsia-400">0</span> PTS
        </div>
    </footer>

    <!-- Lógica de Audio y Juego Integrada -->
    <script>
        class SoundManager {
            constructor() {
                this.ctx = null;
                this.enabled = false;
            }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
                this.enabled = true;
            }
            toggle() {
                if (!this.enabled) {
                    this.init();
                } else {
                    this.enabled = false;
                }
                return this.enabled;
            }
            playCardFlip() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }
            playFoundationScore() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, this.ctx.currentTime);
                osc.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }
        }
        const soundFX = new SoundManager();

        class SolitaireGame {
            constructor() {
                this.deck = [];
                this.waste = [];
                this.foundations = [[], [], [], []];
                this.tableau = [[], [], [], [], [], [], []];
                this.score = 0;
                this.moves = 0;
                this.startTime = null;
            }
            init() {
                this.deck = [];
                this.waste = [];
                this.foundations = [[], [], [], []];
                this.tableau = [[], [], [], [], [], [], []];
                this.score = 0;
                this.moves = 0;
                this.startTime = Date.now();
                this.createDeck();
                this.shuffle();
                this.dealCards();
            }
            createDeck() {
                const suits = ["♠", "♥", "♦", "♣"];
                const colors = { "♠": "black", "♣": "black", "♥": "red", "♦": "red" };
                for (const suit of suits) {
                    for (let value = 1; value <= 13; value++) {
                        this.deck.push({ id: `${suit}-${value}`, suit, value, color: colors[suit], faceUp: false });
                    }
                }
            }
            shuffle() {
                for (let i = this.deck.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [this.deck[i], this.deck[j]] = [this.deck[j], this.deck[i]];
                }
            }
            dealCards() {
                for (let col = 0; col < 7; col++) {
                    for (let row = 0; row <= col; row++) {
                        const card = this.deck.pop();
                        if (row === col) card.faceUp = true;
                        this.tableau[col].push(card);
                    }
                }
            }
            drawFromStock() {
                if (this.deck.length > 0) {
                    const card = this.deck.pop();
                    card.faceUp = true;
                    this.waste.push(card);
                    this.moves++;
                } else if (this.waste.length > 0) {
                    while (this.waste.length > 0) {
                        const card = this.waste.pop();
                        card.faceUp = false;
                        this.deck.push(card);
                    }
                    this.moves++;
                }
            }
            canMoveToTableau(card, targetCard) {
                if (!targetCard) return card.value === 13;
                return card.color !== targetCard.color && card.value === targetCard.value - 1;
            }
            canMoveToFoundation(card, foundationIdx) {
                const foundation = this.foundations[foundationIdx];
                if (foundation.length === 0) return card.value === 1;
                const topCard = foundation[foundation.length - 1];
                return card.suit === topCard.suit && card.value === topCard.value + 1;
            }
            addScore(points) {
                this.score = Math.max(0, this.score + points);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const game = new SolitaireGame();
            let selectedOrigin = null;
            const highScoreEl = document.getElementById('high-score');
            highScoreEl.textContent = localStorage.getItem('solitario_highscore') || 0;

            function startNewGame() {
                game.init();
                render();
            }

            document.getElementById('btn-new-game').addEventListener('click', startNewGame);
            document.getElementById('btn-audio').addEventListener('click', (e) => {
                const active = soundFX.toggle();
                document.getElementById('audio-status').textContent = active ? 'ON' : 'OFF';
            });

            document.getElementById('stock').addEventListener('click', () => {
                game.drawFromStock();
                soundFX.playCardFlip();
                render();
            });

            function render() {
                document.getElementById('score').textContent = game.score;
                document.getElementById('moves').textContent = game.moves;

                const stockEl = document.getElementById('stock');
                stockEl.innerHTML = game.deck.length > 0 ? `<div class="card face-down w-full h-full"></div>` : `<span class="text-cyan-500/40 text-2xl">🔄</span>`;

                const wasteEl = document.getElementById('waste');
                wasteEl.innerHTML = '';
                if (game.waste.length > 0) {
                    wasteEl.appendChild(createCardUI(game.waste[game.waste.length - 1], { type: 'waste' }));
                }

                for (let i = 0; i < 4; i++) {
                    const fEl = document.getElementById(`foundation-${i}`);
                    fEl.innerHTML = '';
                    const foundation = game.foundations[i];
                    if (foundation.length > 0) {
                        fEl.appendChild(createCardUI(foundation[foundation.length - 1], { type: 'foundation', index: i }));
                    } else {
                        const suits = ["♠", "♥", "♣", "♦"];
                        const colors = ["text-cyan-500/30", "text-fuchsia-500/30", "text-cyan-500/30", "text-fuchsia-500/30"];
                        fEl.innerHTML = `<span class="${colors[i]} text-2xl">${suits[i]}</span>`;
                    }
                }

                for (let col = 0; col < 7; col++) {
                    const tEl = document.getElementById(`tableau-${col}`);
                    tEl.innerHTML = '';
                    game.tableau[col].forEach((card, rowIdx) => {
                        const cardEl = createCardUI(card, { type: 'tableau', col, row: rowIdx });
                        cardEl.style.top = `${rowIdx * 24}px`;
                        tEl.appendChild(cardEl);
                    });
                }
                checkHighScore();
            }

            function createCardUI(card, loc) {
                const el = document.createElement('div');
                el.className = `card ${card.color} ${!card.faceUp ? 'face-down' : ''}`;
                if (card.faceUp) {
                    el.innerHTML = `
                        <div class="p-1 flex flex-col justify-between h-full">
                            <div class="text-xs font-bold leading-none">${getCardValueName(card.value)}<br>${card.suit}</div>
                            <div class="text-center text-lg">${card.suit}</div>
                            <div class="text-xs font-bold leading-none text-right rotate-180">${getCardValueName(card.value)}<br>${card.suit}</div>
                        </div>
                    `;
                    el.addEventListener('click', (e) => { e.stopPropagation(); handleCardClick(card, loc); });
                    el.addEventListener('dblclick', (e) => { e.stopPropagation(); handleAutoMoveToFoundation(card, loc); });
                }
                return el;
            }

            function getCardValueName(val) {
                if (val === 1) return 'A';
                if (val === 11) return 'J';
                if (val === 12) return 'Q';
                if (val === 13) return 'K';
                return val;
            }

            function handleCardClick(card, loc) {
                if (!selectedOrigin) {
                    selectedOrigin = { card, loc };
                    highlightSelection(true, loc);
                } else {
                    const src = selectedOrigin.loc;
                    if (loc.type === 'tableau') {
                        attemptMoveToTableau(src, loc.col);
                    } else if (loc.type === 'foundation') {
                        attemptMoveToFoundation(src, loc.index);
                    }
                    highlightSelection(false, src);
                    selectedOrigin = null;
                }
            }

            function highlightSelection(active, loc) {
                if (loc.type === 'tableau') {
                    const colEl = document.getElementById(`tableau-${loc.col}`);
                    if (colEl.children[loc.row]) colEl.children[loc.row].classList.toggle('selected-root', active);
                } else if (loc.type === 'waste') {
                    const wasteEl = document.getElementById('waste');
                    if (wasteEl.firstElementChild) wasteEl.firstElementChild.classList.toggle('selected-root', active);
                }
            }

            function attemptMoveToTableau(src, destCol) {
                const destColumn = game.tableau[destCol];
                const targetCard = destColumn.length > 0 ? destColumn[destColumn.length - 1] : null;
                let movingCards = [];

                if (src.type === 'waste') movingCards = [game.waste[game.waste.length - 1]];
                else if (src.type === 'tableau') movingCards = game.tableau[src.col].slice(src.row);
                else if (src.type === 'foundation') movingCards = [game.foundations[src.index][game.foundations[src.index].length - 1]];

                if (movingCards.length > 0 && game.canMoveToTableau(movingCards[0], targetCard)) {
                    if (src.type === 'waste') game.tableau[destCol].push(game.waste.pop());
                    else if (src.type === 'tableau') {
                        game.tableau[destCol].push(...game.tableau[src.col].splice(src.row));
                        revealTopTableauCard(src.col);
                    } else if (src.type === 'foundation') {
                        game.tableau[destCol].push(game.foundations[src.index].pop());
                        game.addScore(-15);
                    }
                    game.moves++;
                    game.addScore(5);
                    soundFX.playCardFlip();
                    render();
                }
            }

            function attemptMoveToFoundation(src, foundationIdx) {
                let cardToMove = null;
                if (src.type === 'waste') cardToMove = game.waste[game.waste.length - 1];
                if (src.type === 'tableau') cardToMove = game.tableau[src.col][game.tableau[src.col].length - 1];

                if (cardToMove && game.canMoveToFoundation(cardToMove, foundationIdx)) {
                    if (src.type === 'waste') game.foundations[foundationIdx].push(game.waste.pop());
                    else if (src.type === 'tableau') {
                        game.foundations[foundationIdx].push(game.tableau[src.col].pop());
                        revealTopTableauCard(src.col);
                    }
                    game.moves++;
                    game.addScore(10);
                    soundFX.playFoundationScore();
                    render();
                }
            }

            function handleAutoMoveToFoundation(card, loc) {
                for (let i = 0; i < 4; i++) {
                    if (game.canMoveToFoundation(card, i)) {
                        attemptMoveToFoundation(loc, i);
                        break;
                    }
                }
            }

            function revealTopTableauCard(col) {
                const column = game.tableau[col];
                if (column.length > 0 && !column[column.length - 1].faceUp) {
                    column[column.length - 1].faceUp = true;
                    game.addScore(5);
                }
            }

            function checkHighScore() {
                const currentHigh = parseInt(localStorage.getItem('solitario_highscore') || '0');
                if (game.score > currentHigh) {
                    localStorage.setItem('solitario_highscore', game.score);
                    highScoreEl.textContent = game.score;
                }
            }

            setInterval(() => {
                if (game.startTime) {
                    const elapsed = Math.floor((Date.now() - game.startTime) / 1000);
                    const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
                    const secs = String(elapsed % 60).padStart(2, '0');
                    document.getElementById('timer').textContent = `${mins}:${secs}`;
                }
            }, 1000);

            startNewGame();
        });
    </script>
</body>
</html>
